spring:
  application:
    name: smart-diagnosis-api
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/diagnosisdb}

server:
  port: ${SERVER_PORT:8080}

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  temperature: ${GROQ_TEMPERATURE:0.2}
  max-tokens: ${GROQ_MAX_TOKENS:1024}
