services:
  mongodb:
    image: mongo:7
    container_name: diagnosis-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.runCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: diagnosis-mongo-express
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
    depends_on:
      mongodb:
        condition: service_healthy

  app:
    build: .
    container_name: diagnosis-app
    ports:
      - '8080:8080'
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/diagnosisdb
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
